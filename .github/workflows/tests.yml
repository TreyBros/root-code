name: tests

on:
  push:
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        python: ["3.9", "3.13"]
        exclude:                # GitHub's current Ubuntu has no Python 3.9; macOS covers it
          - os: ubuntu-latest
            python: "3.9"
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python }}
      - name: Run the tests
        run: python -m unittest -v
      - name: Build the single file and run it
        run: |
          python build.py
          NO_COLOR=1 python -I dist/rootcode.pyz /help < /dev/null
